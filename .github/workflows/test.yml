# Byte-compiles the stdlib-only Python and runs the unittest suite, one module per process.
# No secrets or model calls. setup-python selects the supported runtime matrix.
name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    # The full integration suite exceeds 15 minutes on some hosted matrix machines.
    # Each module still has the test command's default 600-second failure limit.
    timeout-minutes: 30
    # Disposable hosted runners also test fork contributions without secrets.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Python version
        run: python3 -c 'import sys; print(sys.version); raise SystemExit(sys.version_info < (3, 10))'

      - name: Byte-compile core, plugins and scripts
        run: git ls-files -z -- 'core/*.py' 'plugins/*.py' 'scripts/*.py' | xargs -0 python3 -m py_compile

      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/run_tests.py

      - name: Documentation contracts
        run: python3 scripts/check_docs.py
