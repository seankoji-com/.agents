# Byte-compiles the stdlib-only Python and runs the unittest suite.
# No secrets or model calls. setup-python selects the supported runtime matrix.
name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
          - python: '3.12'
          - python: '3.14'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Python version
        run: python3 -c 'import sys; print(sys.version); raise SystemExit(sys.version_info < (3, 10))'

      - name: Byte-compile core, plugins and scripts
        run: git ls-files -z -- 'core/*.py' 'plugins/*.py' 'scripts/*.py' | xargs -0 python3 -m py_compile

      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v

      - name: Documentation contracts
        run: python3 scripts/check_docs.py
