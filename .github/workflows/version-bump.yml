name: Auto-bump plugin versions

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: version-bump-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    if: github.actor != 'github-actions[bot]' && github.actor != 'seankoji-com-ci[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Pushing with GITHUB_TOKEN would not trigger CI on the bumped head; the App token does.
      - name: Generate seankoji-com-ci App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SEANKOJI_CI_APP_ID }}
          private-key: ${{ secrets.SEANKOJI_CI_PRIVATE_KEY }}
          owner: seankoji-com
          repositories: t3-plugins

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Detect changed plugins and bump versions
        id: bump
        run: |
          HEAD="${{ github.event.pull_request.head.sha }}"
          # Compare against the fork point, not base.sha: commits that landed on the
          # base branch after this PR branched are not this PR's changes.
          BASE=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" "$HEAD")

          changed=0

          for plugin_dir in plugins/*/; do
            [ -d "$plugin_dir" ] || continue
            manifest="${plugin_dir}plugin.json"
            [ -f "$manifest" ] || continue
            plugin_name=$(basename "$plugin_dir")
            # New plugins already declare their initial version; there is no base
            # manifest to read (git show would fail under the runner's pipefail).
            git cat-file -e "$BASE:$manifest" 2>/dev/null || continue

            # Keep these paths aligned with scripts/install.py source_files():
            # each snapshot contains its plugin plus core/ and shared/.
            if ! git diff --quiet "$BASE" "$HEAD" -- "$plugin_dir" "core/" "shared/"; then
              base_version=$(git show "$BASE:$manifest" 2>/dev/null | jq -r '.version // "0.0.0"')
              current_version=$(jq -r '.version' "$manifest")

              if [ "$current_version" = "$base_version" ]; then
                IFS='.' read -r major minor patch <<< "$current_version"
                new_version="${major}.${minor}.$((patch + 1))"

                echo "Bumping $plugin_name: $current_version -> $new_version"

                tmp=$(mktemp)
                jq --arg v "$new_version" '.version = $v' "$manifest" > "$tmp"
                mv "$tmp" "$manifest"

                changed=1
              fi
            fi
          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit version bumps
        if: steps.bump.outputs.changed == '1'
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name  "seankoji-com-ci[bot]"
          git config user.email "288827119+seankoji-com-ci[bot]@users.noreply.github.com"
          git add -u -- plugins/
          git commit -m "chore: auto-bump plugin versions"
          git push origin "HEAD:${PR_HEAD_REF}"
