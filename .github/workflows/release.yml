name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Release Version Bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      existing_tag:
        description: "Retry only the Homebrew formula update for an already published tag (e.g. v1.2.3); skips tests, tagging and the release"
        required: false
        default: ""
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Tag, Release & Update Homebrew Tap
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      EXISTING_TAG: ${{ github.event.inputs.existing_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run test suite
        if: env.EXISTING_TAG == ''
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tests -v

      - name: Determine next version
        id: semver
        if: env.EXISTING_TAG == ''
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "v0.1.0")
          echo "Current latest tag: $LATEST_TAG"
          VER="${LATEST_TAG#v}"
          IFS='.' read -r major minor patch <<< "$VER"
          case "$BUMP_TYPE" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "bump_type must be major, minor, or patch, got '$BUMP_TYPE'" >&2
              exit 1
              ;;
          esac
          NEXT_TAG="v${major}.${minor}.${patch}"
          echo "Next tag: $NEXT_TAG"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Package release tarball
        if: env.EXISTING_TAG == ''
        env:
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          TARBALL="t3-plugins-${TAG}.tar.gz"
          # Archive tree prefixing with t3-plugins-<TAG>/; .gitattributes export-ignore
          # keeps it to what the formula installs.
          git archive --format=tar.gz --prefix="t3-plugins-${TAG}/" -o "$TARBALL" HEAD
          SHA=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "$SHA  $TARBALL" > "${TARBALL}.sha256"
          echo "SHA256: $SHA"
          echo "sha256=$SHA" >> "$GITHUB_ENV"
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"

      - name: Tag commit
        id: tag_commit
        if: env.EXISTING_TAG == ''
        env:
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        id: create_release
        if: env.EXISTING_TAG == ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: ${{ steps.semver.outputs.tag }}
          files: |
            ${{ env.tarball }}
            ${{ env.tarball }}.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Delete orphaned tag and release if the release step failed
        if: always() && steps.tag_commit.outcome == 'success' && steps.create_release.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          # A partially created release (no assets) would otherwise block the retry.
          # Delete it first and stop if that fails, so a release never outlives its tag.
          # Only a confirmed "not found" counts as no release; an inconclusive lookup
          # (timeout, 5xx, auth) keeps the tag so nothing is left half-deleted.
          if lookup=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          elif ! grep -qi 'release not found' <<<"$lookup"; then
            echo "cannot tell whether release $TAG exists ($lookup); keeping the tag for manual cleanup" >&2
            exit 1
          fi
          git push --delete origin "$TAG"

      - name: Resolve an existing release for a formula-only retry
        id: reuse
        if: env.EXISTING_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$EXISTING_TAG"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "existing_tag must look like vMAJOR.MINOR.PATCH, got '$TAG'" >&2; exit 1
          fi
          TARBALL="t3-plugins-${TAG}.tar.gz"
          # The checksum comes from the published asset, not from a fresh archive, so the
          # formula matches exactly what users download.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${TARBALL}.sha256" --dir "$RUNNER_TEMP"
          SHA=$(awk '{print $1}' "$RUNNER_TEMP/${TARBALL}.sha256")
          [ -n "$SHA" ] || { echo "no checksum in ${TARBALL}.sha256" >&2; exit 1; }
          echo "Reusing $TAG with SHA256 $SHA"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_ENV"
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"

      - name: Generate seankoji-com-ci App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SEANKOJI_CI_APP_ID }}
          private-key: ${{ secrets.SEANKOJI_CI_PRIVATE_KEY }}
          owner: seankoji-com
          repositories: homebrew-tap

      - name: Update Homebrew Tap Formula
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.semver.outputs.tag || steps.reuse.outputs.tag }}
          VER: ${{ steps.semver.outputs.version || steps.reuse.outputs.version }}
        run: |
          # Values arrive through the environment, never spliced into the script.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "refusing to write a formula from an unexpected tag, version, or checksum" >&2; exit 1
          fi
          SHA="$sha256"
          URL="https://github.com/seankoji-com/t3-plugins/releases/download/${TAG}/${tarball}"
          BRANCH="release-${TAG}"

          # The token stays in gh's credential helper, never in a remote URL.
          gh auth setup-git
          gh repo clone seankoji-com/homebrew-tap "$RUNNER_TEMP/homebrew-tap"
          TAP="$RUNNER_TEMP/homebrew-tap"
          cd "$TAP"
          git config user.name "seankoji-com-ci[bot]"
          git config user.email "288827119+seankoji-com-ci[bot]@users.noreply.github.com"
          # Idempotent for retries (existing_tag): reuse a release branch that an
          # earlier attempt already pushed, skip the commit when the formula is
          # already applied, and reuse an open PR instead of creating a second one.
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH}"
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
          else
            git checkout -b "${BRANCH}"
          fi
          mkdir -p Formula Aliases
          sed -e "s|__VERSION__|${VER}|" \
              -e "s|__URL__|${URL}|" \
              -e "s|__SHA256__|${SHA}|" \
              "$GITHUB_WORKSPACE/packaging/t3-plugins.rb.tmpl" \
              > Formula/t3-plugins.rb
          # Maintain formula alias for imps
          ln -sf ../Formula/t3-plugins.rb Aliases/imps
          git add Formula/t3-plugins.rb Aliases/imps

          if ! git diff --cached --quiet; then
            git commit -m "feat(formula): update t3-plugins to ${TAG}"
            git push origin "${BRANCH}"
          elif git diff --quiet origin/main -- Formula/t3-plugins.rb Aliases/imps; then
            echo "Formula already matches ${TAG} on main; nothing to do"
            exit 0
          fi

          PR_URL=$(gh pr list --repo seankoji-com/homebrew-tap --head "${BRANCH}" --state open \
            --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create --repo seankoji-com/homebrew-tap \
              --base main --head "${BRANCH}" \
              --title "feat(formula): update t3-plugins to ${TAG}" \
              --body "Automated formula update for ${TAG}.")
          fi
          gh pr merge --repo seankoji-com/homebrew-tap "${PR_URL}" --squash --auto
