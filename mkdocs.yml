site_name: t3-plugins
site_description: Seven workflows for coding agents in T3 Code, each ending in something you can check. Install with Homebrew on macOS or Linux.
site_url: https://seankoji-com.github.io/t3-plugins/
site_dir: !ENV [T3_DOCS_SITE_DIR, site]
repo_url: https://github.com/seankoji-com/t3-plugins
repo_name: seankoji-com/t3-plugins
edit_uri: edit/master/docs/
copyright: Copyright &copy; 2026 Sean Carey. MIT licensed.
theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/mark.svg
  favicon: assets/mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
plugins:
  - search
hooks:
  - scripts/field_guide.py
exclude_docs: |
  field-guide.json
  design/imps-t3/
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
extra_css:
  - stylesheets/extra.css
nav:
  - Overview: index.md
  - Get started:
      - Install and first ten minutes: getting-started.md
      - Slash commands: slash-commands.md
      - Your first imps run: first-workflow.md
      - How the workflows help: case-study.md
      - CLI reference: cli.md
      - Safety and data: safety.md
      - Free supplemental reviews: supplemental-reviews.md
      - Learnings and harvest: learnings.md
      - Troubleshooting: troubleshooting.md
  - Plugins:
      - Choose a workflow: plugins/index.md
      - imps: plugins/imps.md
      - elephant-goldfish: plugins/elephant-goldfish.md
      - ape: plugins/ape.md
      - babysitter: plugins/babysitter.md
      - agent-tuneup: plugins/agent-tuneup.md
      - ralph: plugins/ralph.md
      - focus-group: plugins/focus-group.md
  - Engineering:
      - Architecture: architecture.md
      - T3 thread features: design/t3-thread-features.md
      - Compatibility: compatibility.md
      - Historical provider results: sightings.md
      - Upgrading to plugin 1.0: migration.md
      - Testing: testing.md
      - Contributing: contributing.md
      - Releasing: releasing.md
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
