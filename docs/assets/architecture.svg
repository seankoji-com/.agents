<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 470" class="diagram" role="img" aria-labelledby="arch-title arch-desc" style="font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px">
<title id="arch-title">How a t3-plugins workflow runs</title>
<desc id="arch-desc">A T3 thread reads a plugin entry and one playbook. The playbook calls local helpers, which use only the Python standard library, or T3 host tools for child tasks, previews, and PR watches. imps also records revision-bound evidence in a shared core.</desc>
<defs>
<marker id="arch-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="var(--sp-ink,#1f2a24)" stroke-width="1.4"/></marker>
</defs>
<g fill="none" stroke="var(--sp-ink,#1f2a24)" stroke-width="1.3">
<rect x="40" y="110" width="290" height="118"/>
<rect x="420" y="110" width="300" height="118"/>
<rect x="830" y="60" width="300" height="104"/>
<rect x="830" y="190" width="300" height="104"/>
<rect x="420" y="300" width="300" height="118" stroke-dasharray="4 4"/>
</g>
<g fill="none" stroke="var(--sp-ink,#1f2a24)" stroke-width="1.3" marker-end="url(#arch-arrow)">
<path d="M330 169 H410"/>
<path d="M720 150 Q775 150 775 112 H820"/>
<path d="M720 190 Q775 190 775 242 H820"/>
<path d="M570 228 V290"/>
</g>
<g fill="var(--sp-ink,#1f2a24)">
<text x="40" y="36" style="font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:15px" fill="var(--sp-ochre,#b8862b)">Fig. 1</text>
<text x="92" y="36" style="font-family:'Fraunces',Georgia,serif;font-size:19px">One workflow, three responsibilities</text>
<text x="58" y="146" font-weight="600" font-size="17">Your T3 thread</text>
<text x="58" y="174" fill="var(--sp-ink-soft,#55615a)">Active provider and model</text>
<text x="58" y="198" fill="var(--sp-ink-soft,#55615a)">Your authorization, shell, and files</text>
<text x="438" y="146" font-weight="600" font-size="17">Plugin instructions</text>
<text x="438" y="174" fill="var(--sp-ink-soft,#55615a)">A short entry routes to one playbook</text>
<text x="438" y="198" fill="var(--sp-ink-soft,#55615a)">Shared T3 runtime contract</text>
<text x="848" y="92" font-weight="600" font-size="17">Local helpers</text>
<text x="848" y="118" fill="var(--sp-ink-soft,#55615a)">Python standard library only</text>
<text x="848" y="142" fill="var(--sp-ink-soft,#55615a)">Install, state, hashes, audits</text>
<text x="848" y="222" font-weight="600" font-size="17">T3 host tools</text>
<text x="848" y="248" fill="var(--sp-ink-soft,#55615a)">delegate_task, task_status, previews</text>
<text x="848" y="272" fill="var(--sp-ink-soft,#55615a)">PR watches. Discovered, never assumed</text>
<text x="438" y="336" font-weight="600" font-size="17">Shared core</text>
<text x="438" y="362" fill="var(--sp-ink-soft,#55615a)">imps only: bindings, artifacts,</text>
<text x="438" y="386" fill="var(--sp-ink-soft,#55615a)">evidence tied to a revision</text>
<text x="40" y="452" fill="var(--sp-ink-soft,#55615a)" font-size="13">Every box has local source and tests. No provider SDK and no second scheduler.</text>
</g>
</svg>
