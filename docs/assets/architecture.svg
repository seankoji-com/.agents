<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" role="img" aria-labelledby="title desc">
<title id="title">T3 plugin architecture</title><desc id="desc">The active T3 provider reads an entry and selected playbook. The playbook invokes local deterministic helpers or T3 host tools. imps additionally uses the shared state core and records revision-bound evidence.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#42766a" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="450" rx="12" fill="#f1f6ef"/>
<g font-family="system-ui,sans-serif" fill="#173d35"><text x="38" y="42" font-size="14" letter-spacing="2">ONE WORKFLOW · THREE RESPONSIBILITIES</text>
<rect x="38" y="90" width="244" height="115" rx="8" fill="#164f48"/><text x="60" y="128" font-size="22" fill="white" font-weight="650">Your T3 thread</text><text x="60" y="157" font-size="15" fill="#d2eadd">Active provider and model</text><text x="60" y="182" font-size="15" fill="#d2eadd">Your authorization and tools</text>
<rect x="364" y="90" width="272" height="115" rx="8" fill="white" stroke="#9cbbab"/><text x="386" y="128" font-size="22" font-weight="650">Plugin instructions</text><text x="386" y="157" font-size="15">Small entry → one playbook</text><text x="386" y="182" font-size="15">Shared T3 runtime contract</text>
<rect x="722" y="75" width="278" height="100" rx="8" fill="white" stroke="#9cbbab"/><text x="744" y="110" font-size="21" font-weight="650">Local helpers</text><text x="744" y="140" font-size="15">Files, transforms, hashes, validation</text>
<rect x="722" y="210" width="278" height="100" rx="8" fill="white" stroke="#9cbbab"/><text x="744" y="245" font-size="21" font-weight="650">T3 host tools</text><text x="744" y="275" font-size="15">Tasks, previews, PR watches</text>
<rect x="364" y="285" width="272" height="105" rx="8" fill="#dcecdc" stroke="#9cbbab"/><text x="386" y="323" font-size="21" font-weight="650">Shared state core</text><text x="386" y="350" font-size="15">imps claims, generations, evidence</text><text x="386" y="373" font-size="14">Reports tied to checked revisions</text>
<text x="40" y="351" font-size="16" font-weight="600">No provider SDK in the core.</text><text x="40" y="379" font-size="15">No second task scheduler.</text>
</g>
<g fill="none" stroke="#42766a" stroke-width="2" marker-end="url(#arrow)"><path d="M282 147H352"/><path d="M636 125H710"/><path d="M636 160H675V260H710"/><path d="M500 205V272"/></g>
</svg>
